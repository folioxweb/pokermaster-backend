name: Deploy Backend Migrations & Edge Functions to Supabase

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project & Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'hesjadnveduthwxstvdf' }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
            supabase db push --password "$SUPABASE_DB_PASSWORD"
            echo "Successfully applied database migrations to Supabase."
          else
            echo "Secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD not yet set. Skipping automated db push."
          fi

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'hesjadnveduthwxstvdf' }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
            echo "Successfully deployed Edge Functions to Supabase."
          else
            echo "Secret SUPABASE_ACCESS_TOKEN not yet set. Skipping functions deploy."
          fi
