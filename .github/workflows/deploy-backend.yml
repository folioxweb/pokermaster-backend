name: Deploy Backend Migrations & Edge Functions to Supabase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project & Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'hesjadnveduthwxstvdf' }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "Linking Supabase Project $SUPABASE_PROJECT_ID..."
            supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --debug
            
            echo "Pushing database migrations..."
            supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all --yes --debug
            echo "Successfully applied database migrations to Supabase."
          else
            echo "Secrets SUPABASE_ACCESS_TOKEN and/or SUPABASE_DB_PASSWORD are not set in GitHub repository secrets."
            exit 1
          fi

      - name: Deploy Supabase Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'hesjadnveduthwxstvdf' }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Deploying Edge Functions..."
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
            echo "Successfully deployed Edge Functions to Supabase."
          else
            echo "Secret SUPABASE_ACCESS_TOKEN not set."
            exit 1
          fi
